name: macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Cocoa/OpenGL frameworks are part of the SDK; nothing to install.
      - name: Bootstrap nob
        run: cc -o nob nob.c

      - name: Build examples
        run: ./nob

      # Builds and RUNS the unit tests. They never open a window, so they need no
      # display or GL context.
      - name: Run tests
        run: ./nob test

      # The header is amalgamated from src/ + vendor/; fail if it is stale.
      - name: Check mach.h is in sync with src/
        run: ./scripts/check_generated.sh

      - name: Check namespace
        run: ./scripts/check_namespace.sh
